[package]
name = "dos-gcnn-tauri"
version = "1.1.2"
description = "GRADE Desktop Application"
authors = ["SCD Lab"]
edition = "2021"

[lib]
name = "dos_gcnn_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
